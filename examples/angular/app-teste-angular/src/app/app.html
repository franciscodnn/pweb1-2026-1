<button type="button" class="border-1 m-4 rounded-lg p-1 bg-blue-200 absolute right-1 top-1" 
(click)="toggle()">
    {{ labelTheme() }}
</button>

@if(theme() == 'white') {
    <div class="bg-white text-black">
        <h1 class="text-center text-4l">Olá, Mundo!</h1>

        <p>Disciplina: {{ disciplina }}</p>
        <p>Projeto: {{ title() }}</p>

        <ng-footer></ng-footer>
    </div>
} @else {
    <div class="bg-black text-white">

        <h1 class="text-center text-4l">Olá, Mundo!</h1>

        <p>Disciplina: {{ disciplina }}</p>
        <p>Projeto: {{ title() }}</p>

        <ng-footer></ng-footer>
    </div>
}
