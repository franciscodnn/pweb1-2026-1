<header class="bg-slate-100 border-b border-slate-300 dark:bg-slate-900 dark:border-slate-700 px-6 py-8 flex items-center justify-between">
<div class="flex items-center gap-6">
    <a
      routerLink="/"
      class="text-xl font-bold text-indigo-600 dark:text-indigo-400"
    >FD<span class="text-slate-800 dark:text-white">.dev</span></a>
  </div>
  
  <div class="flex items-center gap-4">
    <a
      routerLink="/"
      class="text-sm text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
    >
      Home
    </a>
    <a
      routerLink="/projects/new"
      class="text-sm text-slate-500 dark:text-slate-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
    >
      + Cadastrar projeto
    </a>
    <app-btn-theme
      [(darkModel)]="themeService.darkMode"
    ></app-btn-theme>
  </div>
</header>

<main>

  <!-- Secao: Perfil -->
  <section class="bg-slate-200 dark:bg-slate-800 px-6 py-16 text-center">
    <img src="https://ui-avatars.com/api/?name=Francisco Dantas&background=random&size=128&rounded=true&bold=true"
      alt="Foto de Francisco Dantas" class="w-28 h-28 rounded-full mx-auto mb-4 ring-4 ring-indigo-500" />
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-1">Francisco Dantas</h1>
    <p class="text-indigo-600 dark:text-indigo-400 font-medium mb-4">Desenvolvedor Full Stack</p>
    <p class="text-slate-600 dark:text-slate-400 max-w-lg mx-auto">
      Entusiasta de tecnologias como Angular, Node.js e boas práticas de desenvolvimento.
    </p>
  </section>
  
  <!-- Espaço para renderização do 
  componente via rota-->
  <router-outlet />
  
</main>

<footer class="bg-slate-900 border-t border-slate-700 py-8 text-center">
  <p class="text-slate-500 text-sm">&copy; 2026 Francisco Dantas</p>
</footer>
