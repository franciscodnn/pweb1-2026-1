<section class="bg-slate-50 dark:bg-slate-950 px-6 py-16">
    <div class="max-w-4xl mx-auto">
        <h2 class="text-2xl font-bold text-white text-center mb-10">Projetos</h2>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

            @for (project of projects(); track project.id) {
            <a [routerLink]="['detail', project.id]">
                <project-card [title]="project.title" [description]="project.description" [repoUrl]="project.repoUrl"
                    [techs]="project.techs"></project-card>
                </a>
            } @empty {
                <p class="dark:text-slate-400">Não há projetos cadastrados!</p>
                }            

        </div>
    </div>
</section>
