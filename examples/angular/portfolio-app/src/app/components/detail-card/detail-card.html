@if (project(); as proj) {

  <!-- Hero do projeto -->
  <section class="bg-slate-200 dark:bg-slate-800 px-6 py-16 text-center">
    <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-3">{{ proj.title }}</h1>
    <p class="text-slate-600 dark:text-slate-400 max-w-xl mx-auto">{{ proj.description }}</p>
  </section>

  <!-- Detalhes -->
  <section class="bg-slate-50 dark:bg-slate-950 px-6 py-16">
    <div class="max-w-2xl mx-auto flex flex-col gap-10">

      <!-- Tecnologias -->
      <div>
        <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-3">Tecnologias</h2>
        <div class="flex flex-wrap gap-2">
          @for (tech of proj.techs; track tech) {
            <span class="text-sm px-3 py-1 bg-indigo-100 dark:bg-indigo-900/60 text-indigo-700 dark:text-indigo-300 rounded-full">
              {{ tech }}
            </span>
          }
        </div>
      </div>

      <!-- Repositório -->
      <div>
        <h2 class="text-lg font-semibold text-slate-800 dark:text-white mb-3">Repositório</h2>
        <a
          [href]="proj.repoUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="inline-flex items-center gap-2 text-indigo-600 dark:text-indigo-400 hover:underline"
        >
          {{ proj.repoUrl }} &rarr;
        </a>
      </div>

      <!-- Ações -->
      <div class="flex gap-4 pt-4 border-t border-slate-200 dark:border-slate-700">
        <button
          (click)="goBack()"
          class="px-5 py-2.5 rounded-lg border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:border-indigo-400 hover:text-indigo-600 dark:hover:text-indigo-400 transition-colors"
        >
          ← Voltar
        </button>
        <a
          [href]="proj.repoUrl"
          target="_blank"
          rel="noopener noreferrer"
          class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition-colors"
        >
          Ver no GitHub
        </a>
      </div>

    </div>
  </section>

} @else {

  <section class="min-h-[60vh] flex flex-col items-center justify-center gap-4 bg-slate-50 dark:bg-slate-950">
    <p class="text-slate-500 dark:text-slate-400">Projeto não encontrado.</p>
    <button
      (click)="goBack()"
      class="px-5 py-2.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-medium transition-colors"
    >
      ← Voltar para o início
    </button>
  </section>

}
