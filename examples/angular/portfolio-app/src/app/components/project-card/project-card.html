<article class="bg-slate-800 rounded-xl p-5 border border-slate-700 flex flex-col gap-3">
    <h3 class="text-white font-semibold text-lg">{{ title() }}</h3>
    <p class="text-slate-400 text-sm flex-1">{{ description() }}</p>

    <div class="flex flex-wrap gap-2">
        @for (tech of techs(); track tech) {
        <span class="text-xs px-2 py-1 bg-indigo-900/60 text-indigo-300 rounded-full">
            {{ tech }}
        </span>
        }
    </div>

    <a [href]="repoUrl()" target="_blank" rel="noopener noreferrer"
        class="text-sm text-indigo-400 hover:text-indigo-300 transition-colors">
        Ver repositorio &rarr;
    </a>
</article>
