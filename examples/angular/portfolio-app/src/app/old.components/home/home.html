<!-- Secao: Perfil -->
<section class="bg-slate-200 dark:bg-slate-800 px-6 py-16 text-center">
  <img src="https://ui-avatars.com/api/?name=Francisco&background=random&size=128&rounded=true&bold=true"
    alt="Foto de Francisco Dantas" class="w-28 h-28 rounded-full mx-auto mb-4 ring-4 ring-indigo-500" />
  <h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-1">Francisco Dantas</h1>
  <p class="text-indigo-600 dark:text-indigo-400 font-medium mb-4">Desenvolvedor Full Stack</p>
  <p class="text-slate-600 dark:text-slate-400 max-w-lg mx-auto">
    Entusiasta de tecnologias como Angular, Node.js e boas práticas de desenvolvimento.
  </p>
</section>

    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">

          [techs]="project.techs" [repoUrl]="project.repoUrl" [yearsExperience]="5"></app-project-card>
